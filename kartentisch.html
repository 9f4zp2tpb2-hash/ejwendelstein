<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartentisch — Terrain-Karten-Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12161c;
    --panel:#1b212a;
    --panel-2:#212834;
    --line:#2b3341;
    --brass:#c69a5c;
    --brass-bright:#e0b876;
    --brass-dim:#7d6440;
    --parchment:#ece5d3;
    --parchment-dim:#9a9284;
    --danger:#c1604f;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%; margin:0;
    background:var(--ink);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  ::selection{background:var(--brass); color:#1b212a;}

  .app{
    display:grid;
    grid-template-rows:auto 1fr auto;
    grid-template-columns:236px 1fr;
    grid-template-areas:
      "top top"
      "side canvas"
      "side status";
    height:100vh;
    width:100vw;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    grid-area:top;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px;
    background:linear-gradient(180deg,#1e2530,#181d26);
    border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(198,154,92,0.08);
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px;
  }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:21px;
    letter-spacing:0.02em;
    margin:0;
    color:var(--parchment);
  }
  .brand span{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--brass-dim);
    text-transform:uppercase;
    letter-spacing:0.14em;
  }
  .toolgroup{ display:flex; gap:6px; align-items:center; }
  .divider-v{ width:1px; height:22px; background:var(--line); margin:0 6px; }

  button.chip{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:500;
    padding:7px 12px;
    border-radius:7px;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:border-color .15s, color .15s, background .15s;
    white-space:nowrap;
  }
  button.chip:hover{ border-color:var(--brass-dim); color:var(--brass-bright); }
  button.chip:disabled{ opacity:.35; cursor:default; }
  button.chip:disabled:hover{ border-color:var(--line); color:var(--parchment); }
  button.chip.danger:hover{ border-color:var(--danger); color:#e8897b; }
  button.chip.primary{
    background:linear-gradient(180deg,#c9a165,#a9803f);
    border-color:#a9803f;
    color:#1b1409;
    font-weight:600;
  }
  button.chip.primary:hover{ filter:brightness(1.08); color:#1b1409; }

  input[type=file]{ display:none; }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    grid-area:side;
    background:var(--panel);
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:16px 14px 20px;
    display:flex; flex-direction:column; gap:18px;
  }
  .side-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--brass-dim);
    margin:0 0 8px 2px;
  }
  .terrain-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .terrain-btn{
    position:relative;
    background:var(--panel-2);
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:8px 6px 7px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    cursor:pointer;
    transition:border-color .15s, transform .1s, background .15s;
  }
  .terrain-btn:hover{ border-color:var(--brass-dim); }
  .terrain-btn:active{ transform:scale(0.96); }
  .terrain-btn.active{
    border-color:var(--brass);
    background:#262c25;
    box-shadow:0 0 0 1px var(--brass), 0 0 14px rgba(198,154,92,0.25);
  }
  .terrain-btn canvas{ display:block; pointer-events:none; }
  .terrain-btn .tname{
    font-size:10.5px;
    font-weight:500;
    color:var(--parchment-dim);
    text-align:center;
    line-height:1.15;
  }
  .terrain-btn.active .tname{ color:var(--parchment); }
  .terrain-btn .tkey{
    position:absolute; top:4px; left:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    color:var(--parchment-dim);
    opacity:.6;
  }

  .eraser-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    background:var(--panel-2);
    border:1.5px dashed var(--line);
    border-radius:9px;
    padding:9px;
    cursor:pointer;
    color:var(--parchment-dim);
    font-size:12px; font-weight:500;
    transition:border-color .15s, color .15s;
  }
  .eraser-btn:hover{ border-color:var(--danger); color:#e8897b; }
  .eraser-btn.active{ border-color:var(--danger); color:#e8897b; border-style:solid; background:#2a1f1e; }

  .brush-row{ display:flex; gap:6px; }
  .brush-btn{
    flex:1;
    background:var(--panel-2);
    border:1.5px solid var(--line);
    border-radius:7px;
    padding:8px 0;
    color:var(--parchment-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    cursor:pointer;
  }
  .brush-btn.active{ border-color:var(--brass); color:var(--brass-bright); background:#262019; }

  .hint{
    font-size:11px;
    line-height:1.5;
    color:var(--parchment-dim);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 11px;
  }
  .hint b{ color:var(--brass-bright); font-weight:600; }

  /* ---------- CANVAS AREA ---------- */
  .canvas-wrap{
    grid-area:canvas;
    position:relative;
    overflow:hidden;
    background:
      repeating-linear-gradient(100deg, #241a10 0px, #2a2013 2px, #201609 4px, #251b0e 7px),
      linear-gradient(160deg,#241b12,#170f08);
  }
  .canvas-wrap::after{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    box-shadow:inset 0 0 140px rgba(0,0,0,0.65);
  }
  canvas#hexcanvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    cursor:cell;
  }
  canvas#hexcanvas.panning{ cursor:grabbing; }

  .zoom-controls{
    position:absolute; right:16px; bottom:16px;
    display:flex; flex-direction:column;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:9px;
    overflow:hidden;
  }
  .zoom-controls button{
    width:34px; height:32px;
    background:transparent; border:none;
    color:var(--parchment); font-size:16px;
    cursor:pointer; border-bottom:1px solid var(--line);
  }
  .zoom-controls button:last-child{ border-bottom:none; }
  .zoom-controls button:hover{ background:var(--panel-2); color:var(--brass-bright); }

  /* ---------- STATUS BAR ---------- */
  .statusbar{
    grid-area:status;
    display:flex; align-items:center; gap:18px;
    padding:7px 16px;
    background:#161b22;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--parchment-dim);
  }
  .statusbar .sep{ color:var(--line); }
  .statusbar b{ color:var(--brass-bright); font-weight:500; }

  /* scrollbar */
  .sidebar::-webkit-scrollbar{ width:8px; }
  .sidebar::-webkit-scrollbar-thumb{ background:#333c4a; border-radius:8px; }
  .sidebar::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width:760px){
    .app{ grid-template-columns:1fr; grid-template-areas:"top" "canvas" "status"; }
    .sidebar{ display:none; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="brand">
      <h1>Kartentisch</h1>
      <span>Terrain-Grid-Editor</span>
    </div>
    <div class="toolgroup">
      <button class="chip" id="btnUndo" title="Rückgängig (Strg+Z)">↺ Rückgängig</button>
      <button class="chip" id="btnRedo" title="Wiederholen (Strg+Y)">↻ Wiederholen</button>
      <div class="divider-v"></div>
      <button class="chip danger" id="btnClear">🗑 Karte leeren</button>
      <div class="divider-v"></div>
      <button class="chip" id="btnLoad">📂 Laden</button>
      <input type="file" id="fileInput" accept="application/json">
      <button class="chip" id="btnSaveJson">💾 Speichern</button>
      <button class="chip primary" id="btnExportPng">🖼 Als PNG</button>
    </div>
  </div>

  <div class="sidebar">
    <div>
      <p class="side-label">Terrains</p>
      <div class="terrain-grid" id="terrainGrid"></div>
    </div>

    <div>
      <button class="eraser-btn" id="eraserBtn"><span>✕</span> Radierer</button>
    </div>

    <div>
      <p class="side-label">Pinselgröße</p>
      <div class="brush-row" id="brushRow">
        <button class="brush-btn active" data-size="1">1</button>
        <button class="brush-btn" data-size="2">7</button>
        <button class="brush-btn" data-size="3">19</button>
      </div>
    </div>

    <div class="hint">
      <b>Ziehen</b> zum Zeichnen · <b>Rechtsklick + Ziehen</b> zum Verschieben · <b>Scrollen</b> zum Zoomen.<br>
      Jede Kachel rastet automatisch auf das nächste Sechseck ein — frei platziert, fest verankert.
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="hexcanvas"></canvas>
    <div class="zoom-controls">
      <button id="zoomIn">+</button>
      <button id="zoomOut">–</button>
    </div>
  </div>

  <div class="statusbar">
    <span id="statHex">Hex —</span>
    <span class="sep">·</span>
    <span id="statTiles"><b>0</b> Kacheln</span>
    <span class="sep">·</span>
    <span id="statZoom">Zoom 100%</span>
    <span class="sep">·</span>
    <span id="statTool">Werkzeug: Grasland</span>
  </div>

</div>

<script>
(function(){
"use strict";

/* ========================= TERRAIN DEFINITIONS ========================= */
const TERRAINS = [
  { id:'grass',    name:'Grasland', colorBase:'#5f7c46', colorLight:'#7f9c5c', colorLine:'#3f5630' },
  { id:'forest',   name:'Wald',     colorBase:'#2c4128', colorLight:'#3f5c39', colorLine:'#1c2c19' },
  { id:'water',    name:'Wasser',   colorBase:'#2c5573', colorLight:'#417999', colorLine:'#1c3a51' },
  { id:'mountain', name:'Gebirge',  colorBase:'#5e564c', colorLight:'#7c7266', colorLine:'#3a352e' },
  { id:'hills',    name:'Hügel',    colorBase:'#76824f', colorLight:'#94a068', colorLine:'#4c5533' },
  { id:'desert',   name:'Wüste',    colorBase:'#b8935a', colorLight:'#d1af79', colorLine:'#8a6a3c' },
  { id:'sand',     name:'Strand',   colorBase:'#cdb87f', colorLight:'#e2d3a2', colorLine:'#a1895a' },
  { id:'snow',     name:'Schnee',   colorBase:'#c9d3d8', colorLight:'#e6edf0', colorLine:'#9fb0b7' },
  { id:'swamp',    name:'Sumpf',    colorBase:'#3c4432', colorLight:'#525c40', colorLine:'#262c1e' },
  { id:'volcano',  name:'Vulkan',   colorBase:'#3f2c26', colorLight:'#5a3c30', colorLine:'#221512' },
];
const TERRAIN_BY_ID = Object.fromEntries(TERRAINS.map(t=>[t.id,t]));

/* deterministic pseudo-random from integer seed */
function rnd(seed){
  let x = Math.sin(seed*127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function hash2(q,r,salt){
  return (q*374761393 + r*668265263 + salt*2654435761) % 1000000;
}

function hexPath(ctx,cx,cy,size){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const ang = Math.PI/180 * (60*i - 30);
    const x = cx + size*Math.cos(ang);
    const y = cy + size*Math.sin(ang);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}

/* ---- texture renderers: each draws inside an already-clipped hex ---- */
function drawBase(ctx,cx,cy,size,t){
  const g = ctx.createRadialGradient(cx,cy-size*0.35,size*0.08,cx,cy,size*1.15);
  g.addColorStop(0,t.colorLight);
  g.addColorStop(1,t.colorBase);
  ctx.fillStyle = g;
  ctx.fillRect(cx-size,cy-size,size*2,size*2);
}

function texGrass(ctx,cx,cy,size,seed){
  ctx.strokeStyle = 'rgba(30,45,20,0.55)';
  ctx.lineWidth = Math.max(0.7,size*0.045);
  for(let i=0;i<9;i++){
    const a = rnd(seed+i)*Math.PI*2;
    const d = rnd(seed+i+50)*size*0.72;
    const x = cx + Math.cos(a)*d;
    const y = cy + Math.sin(a)*d;
    const len = size*0.16 + rnd(seed+i+90)*size*0.08;
    ctx.beginPath();
    ctx.moveTo(x,y+len*0.4);
    ctx.quadraticCurveTo(x+len*0.15,y-len*0.3,x+len*0.05,y-len);
    ctx.stroke();
  }
}
function texForest(ctx,cx,cy,size,seed){
  for(let i=0;i<4;i++){
    const a = rnd(seed+i*3)*Math.PI*2;
    const d = rnd(seed+i*3+1)*size*0.55;
    const x = cx + Math.cos(a)*d;
    const y = cy + Math.sin(a)*d;
    const h = size*0.5 + rnd(seed+i*3+2)*size*0.22;
    ctx.fillStyle = 'rgba(15,22,12,0.4)';
    ctx.beginPath();
    ctx.moveTo(x,y-h*0.55);
    ctx.lineTo(x-h*0.32,y+h*0.15);
    ctx.lineTo(x+h*0.32,y+h*0.15);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x,y-h*0.85);
    ctx.lineTo(x-h*0.24,y-h*0.1);
    ctx.lineTo(x+h*0.24,y-h*0.1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(60,42,26,0.5)';
    ctx.fillRect(x-h*0.045,y+h*0.12,h*0.09,h*0.16);
  }
}
function texWater(ctx,cx,cy,size,seed){
  ctx.strokeStyle = 'rgba(200,228,240,0.4)';
  ctx.lineWidth = Math.max(0.8,size*0.05);
  for(let i=0;i<3;i++){
    const y = cy - size*0.4 + i*size*0.4 + rnd(seed+i)*size*0.08;
    ctx.beginPath();
    ctx.moveTo(cx-size*0.65,y);
    ctx.quadraticCurveTo(cx-size*0.2,y-size*0.14,cx,y);
    ctx.quadraticCurveTo(cx+size*0.2,y+size*0.14,cx+size*0.65,y);
    ctx.stroke();
  }
  ctx.fillStyle='rgba(20,40,55,0.25)';
  ctx.beginPath(); ctx.ellipse(cx,cy+size*0.15,size*0.9,size*0.5,0,0,Math.PI*2); ctx.fill();
}
function texMountain(ctx,cx,cy,size,seed){
  const peaks = 3;
  for(let i=0;i<peaks;i++){
    const px = cx + (i-1)*size*0.42 + rnd(seed+i)*size*0.08 - size*0.04;
    const ph = size*0.75 + rnd(seed+i+10)*size*0.25;
    const pw = size*0.42;
    ctx.fillStyle = i===1 ? 'rgba(30,26,20,0.55)' : 'rgba(30,26,20,0.4)';
    ctx.beginPath();
    ctx.moveTo(px,cy+size*0.55-ph);
    ctx.lineTo(px-pw*0.5,cy+size*0.55);
    ctx.lineTo(px+pw*0.5,cy+size*0.55);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(235,238,235,0.55)';
    ctx.beginPath();
    ctx.moveTo(px,cy+size*0.55-ph);
    ctx.lineTo(px-pw*0.18,cy+size*0.55-ph*0.72);
    ctx.lineTo(px+pw*0.22,cy+size*0.55-ph*0.72);
    ctx.closePath(); ctx.fill();
  }
}
function texHills(ctx,cx,cy,size,seed){
  ctx.strokeStyle='rgba(35,40,20,0.4)';
  for(let i=0;i<3;i++){
    const x = cx + (i-1)*size*0.5 + rnd(seed+i)*size*0.1;
    const y = cy + size*0.2;
    const r = size*0.4 + rnd(seed+i+5)*size*0.1;
    ctx.lineWidth = size*0.06;
    ctx.beginPath();
    ctx.arc(x,y+r*0.3,r,Math.PI,0,false);
    ctx.stroke();
  }
}
function texDesert(ctx,cx,cy,size,seed){
  ctx.strokeStyle='rgba(90,64,28,0.45)';
  ctx.lineWidth=size*0.05;
  for(let i=0;i<3;i++){
    const y = cy - size*0.3 + i*size*0.35;
    ctx.beginPath();
    ctx.moveTo(cx-size*0.7,y+size*0.1);
    ctx.quadraticCurveTo(cx,y-size*0.2,cx+size*0.7,y+size*0.1);
    ctx.stroke();
  }
  ctx.fillStyle='rgba(90,64,28,0.35)';
  for(let i=0;i<6;i++){
    const a=rnd(seed+i)*Math.PI*2, d=rnd(seed+i+30)*size*0.7;
    ctx.beginPath(); ctx.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d,size*0.035,0,Math.PI*2); ctx.fill();
  }
}
function texSand(ctx,cx,cy,size,seed){
  ctx.fillStyle='rgba(120,98,56,0.4)';
  for(let i=0;i<14;i++){
    const a=rnd(seed+i)*Math.PI*2, d=rnd(seed+i+60)*size*0.78;
    ctx.beginPath(); ctx.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d,size*0.028,0,Math.PI*2); ctx.fill();
  }
}
function texSnow(ctx,cx,cy,size,seed){
  ctx.fillStyle='rgba(160,180,190,0.55)';
  for(let i=0;i<10;i++){
    const a=rnd(seed+i)*Math.PI*2, d=rnd(seed+i+40)*size*0.75;
    const x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d;
    ctx.beginPath(); ctx.arc(x,y,size*0.03,0,Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle='rgba(140,160,170,0.4)';
  ctx.lineWidth=size*0.04;
  ctx.beginPath();
  ctx.moveTo(cx-size*0.5,cy+size*0.3);
  ctx.quadraticCurveTo(cx,cy+size*0.05,cx+size*0.5,cy+size*0.3);
  ctx.stroke();
}
function texSwamp(ctx,cx,cy,size,seed){
  ctx.fillStyle='rgba(20,26,16,0.4)';
  for(let i=0;i<3;i++){
    const a=rnd(seed+i)*Math.PI*2, d=rnd(seed+i+20)*size*0.55;
    const x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d;
    ctx.beginPath();
    ctx.ellipse(x,y,size*0.28,size*0.16,rnd(seed+i)*Math.PI,0,Math.PI*2);
    ctx.fill();
  }
  ctx.strokeStyle='rgba(60,80,45,0.5)';
  ctx.lineWidth=size*0.035;
  for(let i=0;i<4;i++){
    const a=rnd(seed+i+70)*Math.PI*2, d=rnd(seed+i+80)*size*0.6;
    const x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+size*0.03,y-size*0.28); ctx.stroke();
  }
}
function texVolcano(ctx,cx,cy,size,seed){
  ctx.fillStyle='rgba(20,12,10,0.55)';
  ctx.beginPath();
  ctx.moveTo(cx,cy-size*0.75);
  ctx.lineTo(cx-size*0.55,cy+size*0.55);
  ctx.lineTo(cx+size*0.55,cy+size*0.55);
  ctx.closePath(); ctx.fill();
  const glow = ctx.createRadialGradient(cx,cy-size*0.6,0,cx,cy-size*0.6,size*0.45);
  glow.addColorStop(0,'rgba(255,140,60,0.9)');
  glow.addColorStop(1,'rgba(255,90,30,0)');
  ctx.fillStyle=glow;
  ctx.beginPath(); ctx.arc(cx,cy-size*0.6,size*0.45,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,120,50,0.7)';
  for(let i=0;i<3;i++){
    const a = rnd(seed+i)*Math.PI - Math.PI/2;
    const d = size*0.3 + rnd(seed+i+5)*size*0.3;
    ctx.beginPath(); ctx.arc(cx+Math.cos(a)*d, cy-size*0.6-Math.sin(a)*d*0.6, size*0.03,0,Math.PI*2); ctx.fill();
  }
}
const TEXTURES = { grass:texGrass, forest:texForest, water:texWater, mountain:texMountain, hills:texHills, desert:texDesert, sand:texSand, snow:texSnow, swamp:texSwamp, volcano:texVolcano };

function drawTerrainHex(ctx,cx,cy,size,id,seed){
  const t = TERRAIN_BY_ID[id];
  ctx.save();
  hexPath(ctx,cx,cy,size);
  ctx.clip();
  drawBase(ctx,cx,cy,size,t);
  TEXTURES[id](ctx,cx,cy,size,seed);
  ctx.restore();
  ctx.strokeStyle = t.colorLine;
  ctx.lineWidth = Math.max(0.8, size*0.045);
  hexPath(ctx,cx,cy,size);
  ctx.stroke();
}

/* ========================= HEX MATH ========================= */
const SQRT3 = Math.sqrt(3);
function axialToWorld(q,r,size){
  return { x: size*(SQRT3*q + SQRT3/2*r), y: size*1.5*r };
}
function worldToAxial(x,y,size){
  const q = (SQRT3/3*x - 1/3*y)/size;
  const r = (2/3*y)/size;
  return cubeRound(q,r);
}
function cubeRound(q,r){
  let x=q, z=r, y=-x-z;
  let rx=Math.round(x), ry=Math.round(y), rz=Math.round(z);
  const dx=Math.abs(rx-x), dy=Math.abs(ry-y), dz=Math.abs(rz-z);
  if(dx>dy && dx>dz) rx=-ry-rz;
  else if(dy>dz) ry=-rx-rz;
  else rz=-rx-ry;
  return { q:rx, r:rz };
}
const NEIGHBORS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function cubeDistance(q1,r1,q2,r2){
  return (Math.abs(q1-q2) + Math.abs(q1+r1-q2-r2) + Math.abs(r1-r2))/2;
}
function brushCells(q,r,size){
  if(size<=1) return [[q,r]];
  const radius = size===2 ? 1 : 2;
  const cells=[];
  for(let dq=-radius;dq<=radius;dq++){
    for(let dr=-radius;dr<=radius;dr++){
      if(Math.abs(dq+dr)<=radius) cells.push([q+dq,r+dr]);
    }
  }
  return cells;
}

/* ========================= STATE ========================= */
const state = {
  hexSize: 34,
  map: new Map(),        // "q,r" -> terrainId
  selected: 'grass',
  brushSize: 1,
  view: { x:0, y:0, zoom:1 },
  hover: null,
  painting:false, panning:false,
  lastPaintKey:null,
  strokeDirty:false,
  panStart:{x:0,y:0},
  history: [ [] ],
  historyIndex: 0,
};
const key = (q,r)=>q+','+r;

/* ========================= CANVAS SETUP ========================= */
const canvas = document.getElementById('hexcanvas');
const ctx = canvas.getContext('2d');
const wrap = document.querySelector('.canvas-wrap');
let dpr = Math.max(1, window.devicePixelRatio||1);
let rafPending = false;

function resizeCanvas(){
  const rect = wrap.getBoundingClientRect();
  dpr = Math.max(1, window.devicePixelRatio||1);
  canvas.width = Math.round(rect.width*dpr);
  canvas.height = Math.round(rect.height*dpr);
  canvas.style.width = rect.width+'px';
  canvas.style.height = rect.height+'px';
  if(state.view.x===0 && state.view.y===0){
    state.view.x = rect.width/2;
    state.view.y = rect.height/2;
  }
  scheduleRender();
}
new ResizeObserver(resizeCanvas).observe(wrap);

function screenToWorld(sx,sy){
  return { x:(sx-state.view.x)/state.view.zoom, y:(sy-state.view.y)/state.view.zoom };
}

function scheduleRender(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{ rafPending=false; render(); });
}

function render(){
  const cssW = canvas.width/dpr, cssH = canvas.height/dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  ctx.setTransform(dpr*state.view.zoom,0,0,dpr*state.view.zoom, dpr*state.view.x, dpr*state.view.y);

  const size = state.hexSize;
  const corners = [
    screenToWorld(0,0), screenToWorld(cssW,0),
    screenToWorld(0,cssH), screenToWorld(cssW,cssH)
  ];
  let qs=[], rs=[];
  corners.forEach(c=>{
    const a = worldToAxial(c.x,c.y,size);
    qs.push(a.q); rs.push(a.r);
  });
  const qMin=Math.min(...qs)-2, qMax=Math.max(...qs)+2;
  const rMin=Math.min(...rs)-2, rMax=Math.max(...rs)+2;

  ctx.lineWidth = 1/state.view.zoom;
  ctx.strokeStyle = 'rgba(236,229,211,0.09)';

  // pass 1: empty grid lines
  for(let r=rMin;r<=rMax;r++){
    for(let q=qMin;q<=qMax;q++){
      const k = key(q,r);
      if(state.map.has(k)) continue;
      const p = axialToWorld(q,r,size);
      hexPath(ctx,p.x,p.y,size*0.96);
      ctx.stroke();
    }
  }
  // pass 2: filled terrain
  for(let r=rMin;r<=rMax;r++){
    for(let q=qMin;q<=qMax;q++){
      const k = key(q,r);
      const id = state.map.get(k);
      if(!id) continue;
      const p = axialToWorld(q,r,size);
      const seed = hash2(q,r,7);
      drawTerrainHex(ctx,p.x,p.y,size*0.98,id,seed);
    }
  }
  // hover / brush preview
  if(state.hover && !state.panning){
    const cells = brushCells(state.hover.q,state.hover.r,state.brushSize);
    ctx.lineWidth = 2/state.view.zoom;
    ctx.strokeStyle = state.selected===null ? 'rgba(193,96,79,0.9)' : 'rgba(198,154,92,0.9)';
    cells.forEach(([q,r])=>{
      const p = axialToWorld(q,r,size);
      hexPath(ctx,p.x,p.y,size*1.0);
      ctx.stroke();
    });
  }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  updateStatus();
}

/* ========================= PAINTING / HISTORY ========================= */
function paintCell(q,r){
  const k = key(q,r);
  if(state.selected===null){
    if(state.map.has(k)){ state.map.delete(k); state.strokeDirty=true; }
  } else {
    if(state.map.get(k)!==state.selected){ state.map.set(k,state.selected); state.strokeDirty=true; }
  }
}
function paintAt(q,r){
  brushCells(q,r,state.brushSize).forEach(([cq,cr])=>paintCell(cq,cr));
}
function commitHistory(){
  if(!state.strokeDirty) return;
  const snap = Array.from(state.map.entries());
  state.history = state.history.slice(0, state.historyIndex+1);
  state.history.push(snap);
  state.historyIndex = state.history.length-1;
  if(state.history.length>60){ state.history.shift(); state.historyIndex--; }
  state.strokeDirty = false;
  updateHistoryButtons();
}
function restoreHistory(idx){
  state.historyIndex = idx;
  state.map = new Map(state.history[idx]);
  scheduleRender();
  updateHistoryButtons();
}
function undo(){ if(state.historyIndex>0) restoreHistory(state.historyIndex-1); }
function redo(){ if(state.historyIndex<state.history.length-1) restoreHistory(state.historyIndex+1); }
function updateHistoryButtons(){
  document.getElementById('btnUndo').disabled = state.historyIndex<=0;
  document.getElementById('btnRedo').disabled = state.historyIndex>=state.history.length-1;
}

/* ========================= POINTER EVENTS ========================= */
canvas.addEventListener('contextmenu', e=>e.preventDefault());

canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX-rect.left, sy = e.clientY-rect.top;
  if(e.button===2 || e.button===1){
    state.panning = true;
    state.panStart = { x:sx-state.view.x, y:sy-state.view.y };
    canvas.classList.add('panning');
  } else if(e.button===0){
    state.painting = true;
    const w = screenToWorld(sx,sy);
    const a = worldToAxial(w.x,w.y,state.hexSize);
    state.lastPaintKey = key(a.q,a.r);
    paintAt(a.q,a.r);
    scheduleRender();
  }
});

canvas.addEventListener('pointermove', e=>{
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX-rect.left, sy = e.clientY-rect.top;
  if(state.panning){
    state.view.x = sx-state.panStart.x;
    state.view.y = sy-state.panStart.y;
    scheduleRender();
    return;
  }
  const w = screenToWorld(sx,sy);
  const a = worldToAxial(w.x,w.y,state.hexSize);
  state.hover = a;
  if(state.painting){
    const k = key(a.q,a.r);
    if(k!==state.lastPaintKey){
      state.lastPaintKey = k;
      paintAt(a.q,a.r);
    }
  }
  scheduleRender();
});

function endPointer(e){
  if(state.painting){ state.painting=false; commitHistory(); }
  if(state.panning){ state.panning=false; canvas.classList.remove('panning'); }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointerleave', ()=>{ state.hover=null; scheduleRender(); });
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX-rect.left, sy = e.clientY-rect.top;
  const before = screenToWorld(sx,sy);
  const factor = e.deltaY<0 ? 1.12 : 1/1.12;
  const newZoom = Math.min(2.6, Math.max(0.35, state.view.zoom*factor));
  state.view.zoom = newZoom;
  state.view.x = sx - before.x*newZoom;
  state.view.y = sy - before.y*newZoom;
  scheduleRender();
}, { passive:false });

function zoomBy(factor){
  const rect = canvas.getBoundingClientRect();
  const sx = rect.width/2, sy = rect.height/2;
  const before = screenToWorld(sx,sy);
  const newZoom = Math.min(2.6, Math.max(0.35, state.view.zoom*factor));
  state.view.zoom = newZoom;
  state.view.x = sx - before.x*newZoom;
  state.view.y = sy - before.y*newZoom;
  scheduleRender();
}
document.getElementById('zoomIn').onclick = ()=>zoomBy(1.2);
document.getElementById('zoomOut').onclick = ()=>zoomBy(1/1.2);

/* ========================= STATUS BAR ========================= */
function updateStatus(){
  const hx = document.getElementById('statHex');
  if(state.hover) hx.textContent = 'Hex q'+state.hover.q+' r'+state.hover.r;
  else hx.textContent = 'Hex —';
  document.getElementById('statTiles').innerHTML = '<b>'+state.map.size+'</b> Kacheln';
  document.getElementById('statZoom').textContent = 'Zoom '+Math.round(state.view.zoom*100)+'%';
  const toolName = state.selected===null ? 'Radierer' : TERRAIN_BY_ID[state.selected].name;
  document.getElementById('statTool').textContent = 'Werkzeug: '+toolName;
}

/* ========================= SIDEBAR: TERRAIN PALETTE ========================= */
const grid = document.getElementById('terrainGrid');
TERRAINS.forEach((t,i)=>{
  const btn = document.createElement('button');
  btn.className = 'terrain-btn' + (t.id===state.selected ? ' active':'');
  btn.dataset.id = t.id;
  const keyLabel = i<9 ? String(i+1) : '0';
  btn.innerHTML = '<span class="tkey">'+keyLabel+'</span><canvas width="52" height="52"></canvas><span class="tname">'+t.name+'</span>';
  btn.addEventListener('click', ()=>selectTerrain(t.id));
  grid.appendChild(btn);
  const mini = btn.querySelector('canvas');
  const mctx = mini.getContext('2d');
  mctx.save();
  hexPath(mctx,26,27,20);
  mctx.clip();
  drawBase(mctx,26,27,20,t);
  TEXTURES[t.id](mctx,26,27,20, hash2(i,3,11));
  mctx.restore();
  mctx.strokeStyle = t.colorLine;
  mctx.lineWidth = 1.4;
  hexPath(mctx,26,27,20);
  mctx.stroke();
});

function selectTerrain(id){
  state.selected = id;
  document.querySelectorAll('.terrain-btn').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  document.getElementById('eraserBtn').classList.remove('active');
  scheduleRender();
}
document.getElementById('eraserBtn').addEventListener('click', ()=>{
  state.selected = null;
  document.querySelectorAll('.terrain-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('eraserBtn').classList.add('active');
  scheduleRender();
});

/* ========================= BRUSH SIZE ========================= */
document.getElementById('brushRow').addEventListener('click', e=>{
  const b = e.target.closest('.brush-btn');
  if(!b) return;
  state.brushSize = parseInt(b.dataset.size,10);
  document.querySelectorAll('.brush-btn').forEach(x=>x.classList.toggle('active', x===b));
  scheduleRender();
});

/* ========================= KEYBOARD SHORTCUTS ========================= */
window.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(e.key==='e' || e.key==='E'){ document.getElementById('eraserBtn').click(); return; }
  const n = parseInt(e.key,10);
  if(!isNaN(n)){
    const idx = n===0 ? 9 : n-1;
    if(TERRAINS[idx]) selectTerrain(TERRAINS[idx].id);
  }
});

/* ========================= TOP BAR ACTIONS ========================= */
document.getElementById('btnUndo').onclick = undo;
document.getElementById('btnRedo').onclick = redo;

let clearArmed = false;
const btnClear = document.getElementById('btnClear');
btnClear.addEventListener('click', ()=>{
  if(!clearArmed){
    clearArmed = true;
    btnClear.textContent = '⚠ Wirklich leeren?';
    setTimeout(()=>{ clearArmed=false; btnClear.textContent='🗑 Karte leeren'; }, 2800);
    return;
  }
  state.map = new Map();
  state.strokeDirty = true;
  commitHistory();
  clearArmed = false;
  btnClear.textContent = '🗑 Karte leeren';
  scheduleRender();
});

document.getElementById('btnSaveJson').addEventListener('click', ()=>{
  const data = {
    version: 1,
    hexSize: state.hexSize,
    tiles: Array.from(state.map.entries()).map(([k,v])=>{
      const [q,r] = k.split(',').map(Number);
      return { q, r, t: v };
    })
  };
  const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'kartentisch-karte.json';
  a.click();
  URL.revokeObjectURL(url);
});

const fileInput = document.getElementById('fileInput');
document.getElementById('btnLoad').addEventListener('click', ()=>fileInput.click());
fileInput.addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      const m = new Map();
      (data.tiles||[]).forEach(tile=>{
        if(TERRAIN_BY_ID[tile.t]) m.set(key(tile.q,tile.r), tile.t);
      });
      state.map = m;
      state.history = [ Array.from(m.entries()) ];
      state.historyIndex = 0;
      updateHistoryButtons();
      scheduleRender();
    }catch(err){
      alert('Diese Datei konnte nicht gelesen werden.');
    }
  };
  reader.readAsText(file);
  fileInput.value = '';
});

document.getElementById('btnExportPng').addEventListener('click', ()=>{
  if(state.map.size===0){ alert('Die Karte ist noch leer — platziere zuerst ein paar Terrains.'); return; }
  const size = state.hexSize;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  state.map.forEach((v,k)=>{
    const [q,r] = k.split(',').map(Number);
    const p = axialToWorld(q,r,size);
    minX=Math.min(minX,p.x-size); maxX=Math.max(maxX,p.x+size);
    minY=Math.min(minY,p.y-size); maxY=Math.max(maxY,p.y+size);
  });
  const pad = size*0.6;
  const w = maxX-minX+pad*2, h = maxY-minY+pad*2;
  const scaleFactor = 2;
  const off = document.createElement('canvas');
  off.width = w*scaleFactor; off.height = h*scaleFactor;
  const octx = off.getContext('2d');
  octx.scale(scaleFactor,scaleFactor);
  octx.fillStyle = '#201609';
  octx.fillRect(0,0,w,h);
  octx.translate(pad-minX, pad-minY);
  state.map.forEach((id,k)=>{
    const [q,r] = k.split(',').map(Number);
    const p = axialToWorld(q,r,size);
    drawTerrainHex(octx,p.x,p.y,size*0.98,id,hash2(q,r,7));
  });
  off.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'kartentisch-karte.png';
    a.click();
    URL.revokeObjectURL(url);
  });
});

/* ========================= INIT ========================= */
resizeCanvas();
updateHistoryButtons();
scheduleRender();

})();
</script>
</body>
